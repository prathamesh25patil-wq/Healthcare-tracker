name: Daily Healthcare Trend Tracker

on:
  schedule:
    - cron: '0 6 * * *' # Runs automatically every day at 6:00 AM UTC
  workflow_dispatch: # Allows you to trigger it manually anytime via GitHub interface

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit changes back to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run tracker script
        run: python tracker.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add healthcare_digest.md
          git commit -m "Auto-update healthcare trends digest [skip ci]" || exit 0
          git push
